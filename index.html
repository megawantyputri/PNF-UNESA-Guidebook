<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Guide Hand Book – Kuliah Lapangan Batu–Malang</title>
<meta name="description" content="Panduan Kuliah Lapangan S1 Pendidikan Nonformal UNESA Angkatan 2025, 17 November 2026.">
<meta property="og:title" content="Travel Guide Hand Book – Batu–Malang">
<meta property="og:description" content="Kuliah Lapangan S1 Pendidikan Nonformal UNESA 2025 · 17 November 2026">
<meta property="og:image" content="page-01.webp">
<meta name="theme-color" content="#1f2d3d">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1f2d3d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

/* tabs */
.top{flex:none;display:flex;align-items:center;background:#17222f;border-bottom:1px solid #2c3d52}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding:10px 6px 10px 12px;scrollbar-width:none}
.tools{flex:none;display:flex;gap:6px;padding:0 10px 0 4px}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:38px;min-width:38px;padding:0 11px;border-radius:99px;border:2px solid #f4d98b;background:transparent;color:#f4d98b;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .x{display:none}
.isfs .tool .e{display:none}.isfs .tool .x{display:block}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-size:14px;font-weight:600;color:#cfd8e3;background:#25364a;border:0;border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#f4d98b;color:#1f2d3d}

/* pager */
.stage{position:relative;flex:1;min-height:0}
.pager{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:8px 12px}
.slide img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px;user-select:none;-webkit-user-select:none}

.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(23,34,47,.78);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:none;z-index:2}
.arrow.l{left:10px}.arrow.r{right:10px}
.arrow:disabled{opacity:.25;cursor:default}
@media (hover:hover) and (pointer:fine){.arrow{display:block}}

/* footer */
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#17222f;border-top:1px solid #2c3d52}
.foot button{font:inherit;font-size:14px;font-weight:700;color:#1f2d3d;background:#f4d98b;border:0;border-radius:99px;padding:9px 18px;text-decoration:none;cursor:pointer}
.foot button:disabled{opacity:.3;cursor:default}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;bottom:0;height:3px;background:#f4d98b;transition:width .2s}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <nav class="tabs" id="tabs" aria-label="Pintasan halaman"></nav>
    <div class="tools">
      <button class="tool" id="fs" aria-label="Layar penuh" title="Layar penuh">
        <svg class="e" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="x" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <a class="tool" href="guidebook.pdf" download aria-label="Unduh PDF" title="Unduh PDF">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>PDF
      </a>
    </div>
  </div>

  <div class="stage">
    <button class="arrow l" id="al" aria-label="Halaman sebelumnya">‹</button>
    <button class="arrow r" id="ar" aria-label="Halaman berikutnya">›</button>
    <main class="pager" id="pager">
    <section class="slide" aria-label="Halaman 1 dari 12"><img data-base="page-01" width="900" height="1600" alt="Halaman 1 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 2 dari 12"><img data-base="page-02" width="900" height="1600" alt="Halaman 2 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 3 dari 12"><img data-base="page-03" width="900" height="1600" alt="Halaman 3 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 4 dari 12"><img data-base="page-04" width="900" height="1600" alt="Halaman 4 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 5 dari 12"><img data-base="page-05" width="900" height="1600" alt="Halaman 5 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 6 dari 12"><img data-base="page-06" width="900" height="1600" alt="Halaman 6 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 7 dari 12"><img data-base="page-07" width="900" height="1600" alt="Halaman 7 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 8 dari 12"><img data-base="page-08" width="900" height="1600" alt="Halaman 8 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 9 dari 12"><img data-base="page-09" width="900" height="1600" alt="Halaman 9 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 10 dari 12"><img data-base="page-10" width="900" height="1600" alt="Halaman 10 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 11 dari 12"><img data-base="page-11" width="900" height="1600" alt="Halaman 11 Travel Guide Hand Book" draggable="false"></section>
    <section class="slide" aria-label="Halaman 12 dari 12"><img data-base="page-12" width="900" height="1600" alt="Halaman 12 Travel Guide Hand Book" draggable="false"></section>
    </main>
  </div>

  <footer class="foot">
    <button id="prev">‹ Sebelumnya</button>
    <span class="count" id="count">1 / 12</span>
    <button id="next">Berikutnya ›</button>
    <div class="bar" id="bar"></div>
  </footer>
</div>

<script>
/* Gambar halaman: mencoba page-XX.jpg, lalu .png, lalu .webp.
   Jadi cukup upload page-07.jpg untuk mengganti halaman 7. */
(function(){
  var EXT=['jpg','png','webp'];
  function load(img,i){
    img.onerror=function(){ if(i+1<EXT.length) load(img,i+1); };
    img.src=img.getAttribute('data-base')+'.'+EXT[i];
  }
  [].forEach.call(document.querySelectorAll('img[data-base]'),function(img){load(img,0)});
})();
</script>
<script>
(function(){
  var TOTAL=12;
  var TABS=[["Cover",1],["Welcome",2],["Informasi",3],["Rundown",4],["Destinasi",5],["Dress Code",7],["Bawaan",8],["Rules",9],["Penutup",12]];

  var pager=document.getElementById('pager'),
      tabsEl=document.getElementById('tabs'),
      count=document.getElementById('count'),
      bar=document.getElementById('bar'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      al=document.getElementById('al'),ar=document.getElementById('ar');
  var cur=1,ticking=false;

  var tabBtns=TABS.map(function(t){
    var b=document.createElement('button');
    b.textContent=t[0];
    b.addEventListener('click',function(){go(t[1])});
    tabsEl.appendChild(b);
    return b;
  });

  function go(n,instant){
    n=Math.max(1,Math.min(TOTAL,n));
    pager.scrollTo({left:(n-1)*pager.clientWidth,behavior:instant?'auto':'smooth'});
  }

  function render(){
    count.textContent=cur+' / '+TOTAL;
    bar.style.width=(cur/TOTAL*100)+'%';
    prev.disabled=al.disabled=cur===1;
    next.disabled=ar.disabled=cur===TOTAL;
    var active=0;
    TABS.forEach(function(t,i){if(cur>=t[1])active=i});
    tabBtns.forEach(function(b,i){
      var on=i===active;
      b.classList.toggle('on',on);
      if(on)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    });
    try{history.replaceState(null,'','#p'+cur)}catch(e){}
    document.title='Hal. '+cur+' · Travel Guide Hand Book';
  }

  pager.addEventListener('scroll',function(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      var n=Math.round(pager.scrollLeft/pager.clientWidth)+1;
      if(n!==cur){cur=n;render()}
    });
  },{passive:true});

  prev.onclick=al.onclick=function(){go(cur-1)};
  next.onclick=ar.onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
    else if(e.key==='Home')go(1);
    else if(e.key==='End')go(TOTAL);
  });
  window.addEventListener('resize',function(){go(cur,true)});

  var fs=document.getElementById('fs'),root=document.documentElement;
  var canFs=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  if(!canFs){fs.style.display='none'}
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
  fs.addEventListener('click',function(){
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{(root.requestFullscreen||root.webkitRequestFullscreen).call(root)}
  });
  function onFs(){
    document.body.classList.toggle('isfs',!!fsEl());
    setTimeout(function(){go(cur,true)},150);
  }
  document.addEventListener('fullscreenchange',onFs);
  document.addEventListener('webkitfullscreenchange',onFs);

  var m=/^#p(\d+)$/.exec(location.hash);
  if(m){cur=Math.max(1,Math.min(TOTAL,+m[1]));go(cur,true)}
  render();

  /* Halaman tambahan: otomatis terdeteksi kalau ada page-13, page-14, dst
     (jpg / png / webp). Berhenti di nomor pertama yang tidak ditemukan. */
  var EXT2=['jpg','png','webp'],wanted=m?+m[1]:1;
  function probe(n){
    if(n>60)return;
    var t=new Image(),i=0;
    var base='page-'+(n<10?'0':'')+n;
    t.onload=function(){
      var sec=document.createElement('section');
      sec.className='slide';sec.setAttribute('aria-label','Halaman '+n);
      var im=document.createElement('img');
      im.src=t.src;im.alt='Halaman '+n+' Travel Guide Hand Book';im.draggable=false;
      sec.appendChild(im);pager.appendChild(sec);
      TOTAL=n;render();
      if(wanted===n)go(n,true);
      probe(n+1);
    };
    t.onerror=function(){ if(++i<EXT2.length)t.src=base+'.'+EXT2[i]; };
    t.src=base+'.'+EXT2[0];
  }
  probe(TOTAL+1);
})();
</script>
</body>
</html>
